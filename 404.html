<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在 | 方寸工具箱</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f9;
    color: #1a1d29;
  }
  .box { text-align: center; max-width: 420px; }
  .code {
    font-size: 88px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -3px;
    background: linear-gradient(135deg, #4f46e5, #0e7490);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: 19px; margin: 18px 0 8px; }
  p { color: #6b7280; font-size: 14px; line-height: 1.7; margin: 0 0 22px; }
  a {
    display: inline-block;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    color: #fff;
    background: #4f46e5;
    border-radius: 9px;
  }
  a:hover { background: #4338ca; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1016; color: #e8eaf0; }
    p { color: #9aa1b1; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者地址打错了。<br>回到首页，16 个工具都在那儿。</p>
    <a href="./">返回工具箱</a>
  </div>
</body>
</html>
