services:
  devtoolbox:
    build: .
    image: devtoolbox:latest
    container_name: devtoolbox
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
