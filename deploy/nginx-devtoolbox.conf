/**
 * DevToolbox 静态站点 Nginx 配置
 *
 * 用法：
 *   sudo cp nginx-devtoolbox.conf /etc/nginx/conf.d/devtoolbox.conf
 *   sudo nginx -t && sudo systemctl reload nginx
 *
 * 注意：阿里云安全组必须放行 3100 端口，否则外网访问不通。
 */

server {
    listen 3100;
    listen [::]:3100;
    server_name _;

    # 站点根目录，deploy.sh 会按实际路径替换这一行
    root /var/www/devtoolbox;
    index index.html;

    charset utf-8;

    # ---------- 日志 ----------
    access_log /var/log/nginx/devtoolbox.access.log;
    error_log  /var/log/nginx/devtoolbox.error.log warn;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- 上传体积（本工具站无上传接口，收紧到 2M） ----------
    client_max_body_size 2m;

    # ---------- 路由 ----------
    # 纯静态站点，用 hash 路由，不需要回落到 index.html；
    # 保持真实 404，避免把错误地址显示成 200 首页。
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- 缓存策略 ----------
    # HTML 每次协商，保证更新后立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态资源长缓存（文件名不含 hash，用 7 天折中）
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---------- 404 ----------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\.(?!well-known) {
        deny all;
    }
}
