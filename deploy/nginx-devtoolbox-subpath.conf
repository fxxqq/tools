/**
 * DevToolbox —— 主域名子目录方案
 * 访问地址：http://example.com/tools/
 *
 * 这段配置需要粘贴到你主站域名对应的 server { } 块内部，
 * 不是独立文件，别直接丢进 conf.d。
 *
 * ⚠️ 三个必须注意的点：
 *   1. /tools 结尾不带斜杠时，页面的相对路径会解析到主站根目录，
 *      所以下面第一条 location 的 301 跳转不能省。
 *   2. 主站如果换了框架或重写了 location /，这里可能被牵连。
 *   3. 站点文件必须和主站同一台机器、同一个 Nginx 可读。
 */

# ---------------------------------------------------------------------------
# 做法 A（推荐）：把站点文件夹直接放进主站根目录，零额外配置
#
#   /var/www/main/          ← 主站 root
#   /var/www/main/tools/    ← 把 devtoolbox 的文件放这里
#
# 只要主站是静态站点（location / { try_files $uri $uri/ =404; }），
# 访问 /tools/ 就能直接命中，不需要写任何 location。
# 只需补一条跳转和缓存规则：
# ---------------------------------------------------------------------------

# 不带斜杠时跳转，否则 css/style.css 会被解析成 /css/style.css
location = /tools {
    return 301 /tools/;
}

# 子目录内 HTML 不缓存，保证更新即时生效
location ~ ^/tools/.*\.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# ---------------------------------------------------------------------------
# 做法 B：站点放在主站目录之外（如 /var/www/devtoolbox），用 alias 挂载
# 适用于主站 root 不是静态目录、或不想混放文件的情况。
# 注意：不要同时启用 A 和 B。
