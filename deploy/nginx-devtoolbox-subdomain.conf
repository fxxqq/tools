/**
 * DevToolbox —— 二级域名方案（推荐）
 * 访问地址：http://tools.example.com
 *
 * 优点：与主站完全隔离，共用 80 端口靠 server_name 区分虚拟主机，
 *       不需要额外端口，不影响主站任何配置。
 *
 * 用法：
 *   1. 把 tools.example.com 替换成你的真实域名
 *   2. sudo cp nginx-devtoolbox-subdomain.conf /etc/nginx/conf.d/devtoolbox.conf
 *   3. sudo nginx -t && sudo systemctl reload nginx
 *   4. DNS 添加 A 记录：tools → ECS 公网 IP
 */

# ---------- HTTP ----------
server {
    listen 80;
    listen [::]:80;
    server_name tools.example.com;

    # 配好证书后取消下面这行注释，强制跳转 HTTPS
    # return 301 https://$host$request_uri;

    root /var/www/devtoolbox;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/devtoolbox.access.log;
    error_log  /var/log/nginx/devtoolbox.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\.(?!well-known) { deny all; }
}

